name: poke-lark

on:
  schedule:
    # UTC。GitHub の schedule は混雑時にずれる(保証なし)
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "送信せず payload だけ出力"
        type: boolean
        default: false
      seed:
        description: "既読登録のみ(初回セットアップ用)"
        type: boolean
        default: false

concurrency:
  group: poke-lark
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run notifier
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_WEBHOOK_SECRET: ${{ secrets.LARK_WEBHOOK_SECRET }}
          LARK_WEBHOOK_KEYWORD: ${{ secrets.LARK_WEBHOOK_KEYWORD }}
        run: |
          set -euo pipefail
          ARGS="--state state/poke_state.json"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.seed }}"    = "true" ]; then ARGS="$ARGS --seed"; fi
          mkdir -p state
          python3 poke_lark.py $ARGS

      - name: Persist state
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          if git diff --quiet -- state/; then
            echo "state unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/poke_state.json
          git commit -m "chore(state): update seen items [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
